phenotypeservice.elasticsearch.index-prefix=phenotypeservice-phenotypes
%test.phenotypeservice.elasticsearch.index-prefix=test-phenotypeservice-phenotypes
%test.phenotypeservice.elasticsearch.delete-index-on-start=true

data.dir=./data
%prod.data.dir=/data

# Quarkus configurations
quarkus.rest-client.image-service.url=http://imageservice:8080
%dev.quarkus.rest-client.image-service.url=http://0.0.0.0:8084

%prod.quarkus.elasticsearch.hosts=es:9200
%dev.quarkus.elasticsearch.hosts=0.0.0.0:9200
%test.quarkus.elasticsearch.hosts=0.0.0.0:9200

quarkus.http.cors=true
quarkus.http.cors.origins=*

quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=ERROR
%dev.quarkus.log.category."ibb.api.phenotypeservice".level=DEBUG

quarkus.container-image.registry=docker.gitlab.gwdg.de
quarkus.container-image.group=ibb/api
